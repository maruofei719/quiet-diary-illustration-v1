interface:
  display_name: "Quiet Diary Illustration"
  short_description: "Turn photos into dreamlike associative posters"
  default_prompt: "Use $quiet-diary-illustration-v1 in Associative Memory Mode. Keep one recognisable memory anchor, erase the original photographic space, choose one associative grammar, make one motif transform or echo, dissolve at least one boundary, create one precise impossible relationship, generate the poster, inspect it, and return the image, grammar, and exact prompt."
